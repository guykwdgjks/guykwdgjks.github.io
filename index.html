<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>外卖点餐</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="title">🍔 外卖点餐</h1>
            <p class="subtitle">点击图标跳转至外卖平台</p>
        </header>

        <div class="platforms-grid">
            <a href="https://www.meituan.com" target="_blank" class="platform-card meituan">
                <div class="platform-icon">
                    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="50" cy="50" r="45" fill="#FFD100"/>
                        <text x="50" y="62" text-anchor="middle" font-size="40" font-weight="bold" fill="#000">M</text>
                    </svg>
                </div>
                <h2 class="platform-name">美团外卖</h2>
                <p class="platform-desc">品质外卖 美好食光</p>
            </a>

            <a href="https://www.ele.me" target="_blank" class="platform-card eleme">
                <div class="platform-icon">
                    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="50" cy="50" r="45" fill="#00C800"/>
                        <text x="50" y="62" text-anchor="middle" font-size="36" font-weight="bold" fill="#FFF">饿</text>
                    </svg>
                </div>
                <h2 class="platform-name">饿了么</h2>
                <p class="platform-desc">饿了别叫妈 叫饿了么</p>
            </a>

            <a href="https://daojia.jd.com" target="_blank" class="platform-card jd">
                <div class="platform-icon">
                    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                        <rect x="5" y="5" width="90" height="90" rx="15" fill="#E53935"/>
                        <text x="50" y="65" text-anchor="middle" font-size="40" font-weight="bold" fill="#FFF">J</text>
                    </svg>
                </div>
                <h2 class="platform-name">京东到家</h2>
                <p class="platform-desc">1小时送达</p>
            </a>

            <a href="https://www.taobao.com" target="_blank" class="platform-card taobao">
                <div class="platform-icon">
                    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="50" cy="50" r="45" fill="#FF4400"/>
                        <text x="50" y="62" text-anchor="middle" font-size="32" font-weight="bold" fill="#FFF">淘</text>
                    </svg>
                </div>
                <h2 class="platform-name">淘宝闪购</h2>
                <p class="platform-desc">限时特惠 超值抢购</p>
            </a>

            <a href="https://www.mixue.com" target="_blank" class="platform-card mixue">
                <div class="platform-icon">
                    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="50" cy="50" r="45" fill="#FF6B6B"/>
                        <text x="50" y="62" text-anchor="middle" font-size="30" font-weight="bold" fill="#FFF">雪</text>
                    </svg>
                </div>
                <h2 class="platform-name">蜜雪冰城</h2>
                <p class="platform-desc">新鲜冰淇淋 甜蜜满杯</p>
            </a>

            <a href="https://www.kfc.com.cn" target="_blank" class="platform-card kfc">
                <div class="platform-icon">
                    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="50" cy="50" r="45" fill="#FF0000"/>
                        <text x="50" y="62" text-anchor="middle" font-size="36" font-weight="bold" fill="#FFF">K</text>
                    </svg>
                </div>
                <h2 class="platform-name">肯德基</h2>
                <p class="platform-desc">美味炸鸡 乐享生活</p>
            </a>
        </div>

        <footer class="footer">
            <p>点击图标即可跳转至对应外卖平台</p>
            <p class="disclaimer">新手学习，如有侵权，邮箱私信2629987196@qq.com</p>
        </footer>
    </div>
</body>
</html>
